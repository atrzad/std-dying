name: ayo-std-tailscale
# Endereço antigo (https://ayo-std.<sua-tailnet>.ts.net), mantido até 14/11/2026 só para levar ao std(dying):
# o servidor responde com um redirecionamento para URL_PUBLICA (ENDERECOS_ANTIGOS* no .env).
# Depois dessa data: docker compose down (e apagar a máquina ayo-std no painel do Tailscale).
services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: ayo-std-tailscale
    hostname: ayo-std
    network_mode: host          # enxerga o std(dying) em 127.0.0.1:3300
    env_file: .env
    environment:
      - TS_HOSTNAME=ayo-std
      - TS_USERSPACE=true
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_AUTH_ONCE=true
    volumes:
      - ./estado:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    restart: unless-stopped
