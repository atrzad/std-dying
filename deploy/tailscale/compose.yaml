name: std-dying-tailscale
# Segunda "máquina" na rede Tailscale, só para o std(dying): https://std-dying.<sua-tailnet>.ts.net
# Não mexe no tailscaled da máquina nem no Funnel do Nossos Dias (roda em modo userspace, com estado próprio).
services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: std-dying-tailscale
    hostname: std-dying
    network_mode: host          # enxerga o site em 127.0.0.1:3300
    env_file: .env              # TS_AUTHKEY=... (só você edita; nunca vai para o git)
    environment:
      - TS_HOSTNAME=std-dying
      - TS_USERSPACE=true
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_AUTH_ONCE=true
    volumes:
      - ./estado:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    restart: unless-stopped
